<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wild Reserve">
<meta name="theme-color" content="#1b2419">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Wild Reserve</title>
<style>
html,body{margin:0;height:100%;background:#0d120c;color:#eef1e6;font-family:"Avenir Next Condensed","Avenir Next","Arial Narrow",system-ui,sans-serif}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:min(360px,100%);display:grid;gap:12px;text-align:center}
#lock h1{margin:0;font-size:40px;letter-spacing:.06em}#lock h1 span{color:#ff7a2f}
#lock p{margin:0;color:#a9b3a0}
#lock input{font:600 18px inherit;font-family:inherit;padding:12px 14px;border-radius:10px;border:1px solid rgba(238,241,230,.25);background:#1b2419;color:#eef1e6;text-align:center}
#lock button{font:700 17px inherit;font-family:inherit;padding:12px;border-radius:24px;border:0;background:#ff7a2f;color:#1b1208}
#lock label{color:#a9b3a0;font-size:15px}
#err{color:#ff5a4a;min-height:1.2em}
</style></head><body>
<div id="lock"><form id="f" autocomplete="on">
<h1>WILD <span>RESERVE</span></h1>
<p>Private hunt. Enter the password.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
<label><input id="remember" type="checkbox" checked> Remember on this device</label>
<button type="submit" id="go">Unlock</button>
<div id="err" role="alert"></div>
</form></div>
<script>
const SALT = Uint8Array.from(atob("YhYL2GM0Ibm2nfCyFuwJpQ=="), c => c.charCodeAt(0));
const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const buf = new Uint8Array(await (await fetch('game.enc', { cache: 'no-cache' })).arrayBuffer());
  let plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)));
  if (plain[0] === 0x1f && plain[1] === 0x8b) plain = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(plain));
}
async function start(game) {
  const st = document.createElement('style'); st.textContent = game.css; document.head.appendChild(st);
  document.body.innerHTML = game.html;
  const url = URL.createObjectURL(new Blob([game.js], { type: 'text/javascript' }));
  await import(url);
}
async function tryStored() {
  let raw = null;
  try { raw = localStorage.getItem('wr-key'); } catch (e) {}
  if (!raw) return false;
  try {
    const key = await crypto.subtle.importKey('raw', unb64(raw), 'AES-GCM', false, ['decrypt']);
    await start(await open(key));
    return true;
  } catch (e) { try { localStorage.removeItem('wr-key'); } catch (_) {} return false; }
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
  try {
    const key = await keyFromPassword(document.getElementById('pw').value);
    const game = await open(key);
    if (document.getElementById('remember').checked) { try { localStorage.setItem('wr-key', b64(await crypto.subtle.exportKey('raw', key))); } catch (_) {} }
    await start(game);
  } catch (e2) {
    err.textContent = navigator.onLine === false ? 'You are offline and this device has no saved copy yet.' : 'That password is not right.';
    go.disabled = false; go.textContent = 'Unlock';
  }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
tryStored();
</script>
</body></html>
